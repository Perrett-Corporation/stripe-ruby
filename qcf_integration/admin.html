<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>QCF Admin</title>
    <style>body{font-family:Arial,Helvetica,sans-serif;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px}</style>
  </head>
  <body>
    <h1>QCF Admin Dashboard</h1>
    <div id="content">Loading...</div>
    <script>
      fetch('/admin_data').then(r=>r.json()).then(d=>{
        let html = '<h2>Ideas</h2>';
        html += '<ul>'+d.ideas.map(i=>'<li><strong>'+i.title+'</strong> — '+(i.description||'')+'</li>').join('')+'</ul>';
        html += '<h2>Tasks</h2>';
        html += '<ul>'+d.tasks.map(t=>'<li><strong>'+t.title+'</strong> — '+t.status+'</li>').join('')+'</ul>';
        html += '<h2>Recent Audit</h2>';
        html += '<ul>'+d.audits.map(a=>'<li>['+a.created_at+'] '+a.event_type+': '+a.details+'</li>').join('')+'</ul>';
        document.getElementById('content').innerHTML = html;
      }).catch(e=>{document.getElementById('content').textContent = 'Error loading admin data';});
    </script>
  </body>
</html>
